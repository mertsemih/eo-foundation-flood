[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eoflood"
version = "0.1.0"
description = "Parameter-efficient fine-tuning of Earth-observation foundation models for flood segmentation (Sen1Floods11)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mert Semih Sarıyerli", email = "semihmertsariyerli.06@gmail.com" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "rasterio>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "segmentation-models-pytorch>=0.3.3",
]

[project.optional-dependencies]
foundation = [
    "terratorch>=1.0",
    "peft>=0.10",
    "huggingface-hub>=0.23",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
